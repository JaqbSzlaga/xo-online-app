<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>XO Chaos Online — Clean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4dfb9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="XO Chaos" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="icon" href="/static/icon-192.png" />
  <link rel="stylesheet" href="/static/style.css?v=v31-clean" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="bg-symbols" id="bgSymbols"></div>

  <main class="app">
    <header class="app-header">
      <div>
        <div class="eyebrow" data-i18n="appLabel">gra online</div>
        <h1><span>X</span>O Chaos</h1>
      </div>
      <button id="langBtn" class="icon-btn" type="button">ENG</button>
    </header>

    <section id="menuView" class="panel">
      <div class="hero">
        <div class="hero-logo"><span>X</span><span>O</span></div>
        <div>
          <h2 data-i18n="mainTitle">Wybierz grę</h2>
          <p data-i18n="mainSub">Prosta wersja bez profili, punktów, sklepu i rankingu.</p>
        </div>
      </div>

      <div class="section">
        <h3 data-i18n="modeTitle">Tryb gry</h3>
        <div class="segmented three">
          <button type="button" data-play="online" class="active"><span>🌐</span><b data-i18n="online">Online</b></button>
          <button type="button" data-play="local"><span>👥</span><b data-i18n="local">Lokalnie</b></button>
          <button type="button" data-play="bot"><span>🤖</span><b data-i18n="bot">Bot</b></button>
        </div>
      </div>

      <div class="section">
        <h3 data-i18n="boardTitle">Plansza</h3>
        <div class="cards two">
          <button type="button" data-version="classic" class="mode-card active">
            <strong data-i18n="classic">Klasyczny</strong>
            <small data-i18n="classicDesc">Jedna plansza 3×3.</small>
          </button>
          <button type="button" data-version="student" class="mode-card">
            <strong data-i18n="student">Studencki</strong>
            <small data-i18n="studentDesc">Dziewięć małych plansz i wybór kolejnej.</small>
          </button>
        </div>
      </div>

      <div class="section">
        <button id="specialToggleBtn" class="fold-btn" type="button">
          <span data-i18n="specialRules">Zasady specjalne</span>
          <b>⌄</b>
        </button>

        <div id="specialPanel" class="special-panel hidden">
          <div class="toggle-list">
            <button type="button" data-special="sudden">
              <span>⏱️</span>
              <div><b data-i18n="sudden">Nagła śmierć</b><small data-i18n="suddenDesc">Limit czasu na ruch.</small></div>
            </button>
            <button type="button" data-special="alternate">
              <span>🔁</span>
              <div><b data-i18n="alternate">Naprzemienny start</b><small data-i18n="alternateDesc">Po rundzie zaczyna drugi symbol.</small></div>
            </button>
            <button type="button" data-special="chaos" id="chaosToggle">
              <span>🌀</span>
              <div><b data-i18n="chaos">Chaos</b><small data-i18n="chaosDesc">Tylko w trybie Studenckim.</small></div>
            </button>
            <button type="button" data-special="firstBlood" id="firstBloodToggle">
              <span>🩸</span>
              <div><b data-i18n="firstBlood">Pierwsza krew</b><small data-i18n="firstBloodDesc">Pierwsza zdobyta mała plansza daje zamianę plansz.</small></div>
            </button>
          </div>

          <div class="grid-options">
            <label>
              <span data-i18n="scoreLimit">Limit punktów</span>
              <select id="targetScore">
                <option value="0" data-i18n="oneRound">Jedna runda</option>
                <option value="3">Do 3</option>
                <option value="5">Do 5</option>
              </select>
            </label>
            <label id="timerWrap">
              <span data-i18n="moveLimit">Czas ruchu</span>
              <select id="moveTimeLimit">
                <option value="5">5 s</option>
                <option value="10" selected>10 s</option>
                <option value="15">15 s</option>
              </select>
            </label>
            <label id="botDifficultyWrap" class="hidden">
              <span data-i18n="botLevel">Poziom bota</span>
              <select id="botDifficulty">
                <option value="easy" data-i18n="easy">Łatwy</option>
                <option value="normal" selected data-i18n="normal">Normalny</option>
                <option value="hard" data-i18n="hard">Trudny</option>
              </select>
            </label>
            <label id="chaosVariantWrap" class="hidden">
              <span data-i18n="chaosType">Typ chaosu</span>
              <select id="chaosVariant">
                <option value="warned" data-i18n="warned">Jawny</option>
                <option value="hidden" data-i18n="hidden">Ukryty</option>
                <option value="brutal" data-i18n="brutal">Brutalny</option>
              </select>
            </label>
            <label id="chaosIntervalWrap" class="hidden">
              <span data-i18n="chaosTime">Chaos co maks.</span>
              <select id="chaosBrutalInterval">
                <option value="15">15 s</option>
                <option value="30" selected>30 s</option>
                <option value="45">45 s</option>
                <option value="60">60 s</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="section room-section">
        <h3 data-i18n="roomsTitle">Pokoje</h3>
        <input id="roomNameInput" maxlength="32" placeholder="Nazwa pokoju online" />
        <button id="startBtn" class="primary-btn" type="button" data-i18n="startGame">Start gry</button>

        <div class="join-row">
          <input id="roomCodeInput" maxlength="8" placeholder="Kod pokoju" />
          <button id="joinRoomBtn" class="secondary-btn" type="button" data-i18n="join">Dołącz</button>
        </div>

        <button id="publicRoomsBtn" class="secondary-btn wide" type="button" data-i18n="publicRooms">Pokoje publiczne</button>
      </div>

      <div class="footer-actions">
        <button id="instructionsBtn" type="button" class="ghost-btn" data-i18n="instructions">Instrukcja</button>
        <button id="settingsBtn" type="button" class="ghost-btn" data-i18n="settings">Ustawienia</button>
      </div>
    </section>

    <section id="gameView" class="panel game-panel hidden">
      <div class="game-top">
        <button id="gameHelpBtn" class="tool-btn" type="button">📖 <span data-i18n="instructionsShort">Instrukcja</span></button>
        <button id="copyLinkBtn" class="tool-btn" type="button">🔗 <span data-i18n="link">Link</span></button>
        <button id="leaveBtn" class="tool-btn strong" type="button">🏠 <span data-i18n="menu">Menu</span></button>
      </div>

      <div class="game-info">
        <div><small data-i18n="room">Pokój</small><b id="roomCodeLabel">—</b></div>
        <div><small data-i18n="you">Ty</small><b id="playerSymbol">—</b></div>
        <div><small data-i18n="score">Wynik</small><b><span id="scoreX">0</span>:<span id="scoreO">0</span></b></div>
      </div>

      <div id="status" class="status">—</div>

      <div id="chaosInfo" class="info-line hidden"></div>
      <div id="firstBloodInfo" class="info-line hidden"></div>
      <button id="firstBloodBtn" type="button" class="warning-btn hidden" data-i18n="useFirstBlood">Użyj Pierwszej Krwi</button>

      <div id="classicBoard" class="board"></div>
      <div id="studentBoard" class="ultimate-board hidden"></div>

      <section id="endPanel" class="end-panel hidden">
        <h2 id="endTitle">Koniec</h2>
        <p id="endText"></p>
        <div class="end-actions">
          <button id="rematchBtn" class="primary-btn" type="button" data-i18n="rematch">Rewanż</button>
          <button id="resetScoreBtn" class="secondary-btn" type="button" data-i18n="resetScore">Reset wyniku</button>
        </div>
      </section>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Modal</h2>
        <button id="modalCloseBtn" type="button">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="versionBadge" class="version-badge">v31-clean</div>

  <script src="/static/game.js?v=v31-clean"></script>
</body>
</html>
